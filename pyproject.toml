[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "the-guy"
version = "0.1.0"
description = "One guy. Every agent. Any repo. A local-first, repository-agnostic multi-agent software-engineering orchestrator."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dwarkesh Kaswala" }]
requires-python = ">=3.9"
keywords = ["orchestrator", "agents", "git", "worktrees", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
guy = "the_guy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
